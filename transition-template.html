<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Transition Template</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }

  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ==== Add your animated elements and @keyframes below ==== */

  #element {
    opacity: 0;
    animation: fadeIn 0.5s ease forwards,
               fadeOut 0.5s ease forwards;
    animation-delay: 0s, 2.5s;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  @keyframes fadeOut {
    from { opacity: 1; }
    to   { opacity: 0; }
  }

  /* ============================================================= */
</style>
</head>
<body>

<div id="stage">
  <div id="element">
    <!-- your content here -->
  </div>
</div>

<script>
  // Pure CSS animation — no JavaScript required here.
  // Total animation length: adjust to match your @keyframes timing.
  // Trigger the "Refresh Browser Source" hotkey in OBS to replay it.
</script>

</body>
</html>
